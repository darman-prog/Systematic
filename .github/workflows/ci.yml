name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancela corridas obsoletas en PRs, pero deja terminar siempre la validación de main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validar
      - run: npx vitest run
      - run: npm run build

  e2e:
    name: E2E
    # Corre tanto en PRs como en push directo a main tras superar la fase estática y unitaria.
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        # Claves de prueba para ejercitar en CI la misma ruta de cuenta/onboarding que producción sin exponer secretos.
        env:
          VITE_FIREBASE_API_KEY: demo-api-key-ci
          VITE_FIREBASE_AUTH_DOMAIN: systematic-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: systematic-ci
          VITE_FIREBASE_APP_ID: 1:000000000000:web:ci0000000000
      # Conserva trazas y contextos de error cuando un test E2E falla en el runner efímero.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
